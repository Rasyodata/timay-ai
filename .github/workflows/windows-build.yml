name: Windows kurulum dosyası

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npm run typecheck
      - run: npm test

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t timay-sunucu .

  windows:
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run dist:win -w desktop
        env:
          VITE_TIMAY_SERVER_URL: ${{ vars.TIMAY_SERVER_URL }}
      # Zip'siz tek dosya: indirince doğrudan Timay-Kurulum.exe iner.
      - uses: actions/upload-artifact@v7
        with:
          path: desktop/dist/Timay-Kurulum.exe
          archive: false
          if-no-files-found: error
      # main dalındaki her sürüm, zip'siz tek .exe olarak Releases sayfasına konur.
      # Sabit indirme adresi: https://github.com/Rasyodata/timay-ai/releases/latest/download/Timay-Kurulum.exe
      - name: Sürümü yayınla
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "surum-${{ github.run_number }}" desktop/dist/Timay-Kurulum.exe
          --title "Timay sürüm ${{ github.run_number }}"
          --notes "Windows kurulum dosyası. İndirip çift tıklayın; Windows uyarı verirse Ek bilgi, ardından Yine de çalıştır."
          --latest
